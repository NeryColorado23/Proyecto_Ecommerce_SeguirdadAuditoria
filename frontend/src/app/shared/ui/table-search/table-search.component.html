<div class="relative w-full max-w-xs">
  <svg
    class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-base-content/40"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <circle cx="11" cy="11" r="7" />
    <path d="M21 21l-4.3-4.3" stroke-linecap="round" />
  </svg>
  <input
    #searchInput
    type="text"
    class="input input-bordered input-sm w-full pl-9 pr-8"
    [placeholder]="placeholder"
    (input)="query.emit($any($event.target).value)"
  />
  @if (searchInput.value) {
    <button
      type="button"
      class="absolute right-2 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-base-content"
      (click)="clear(searchInput)"
      aria-label="Limpiar búsqueda"
    >
      ✕
    </button>
  }
</div>
