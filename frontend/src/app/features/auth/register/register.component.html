<app-auth-layout
  title="Solicitar acceso"
  subtitle="Crea tu cuenta de equipo para entrar al panel."
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage()) {
      <div class="auth-form__error" role="alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="auth-form__success" role="status">{{ successMessage() }}</div>
    }

    <div class="auth-field">
      <label for="email">Correo de trabajo</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@empresa.com"
      />
    </div>

    <div class="auth-field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="••••••••"
      />
    </div>

    <button class="auth-submit" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</app-auth-layout>
