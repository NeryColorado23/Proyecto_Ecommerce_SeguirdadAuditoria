<app-auth-layout
  title="Recuperar contraseña"
  subtitle="Te enviaremos un enlace para restablecerla."
>
  @if (sent()) {
    <div class="auth-form">
      <div class="auth-form__success" role="status">
        Si el correo existe, te llegará un enlace para restablecer tu contraseña.
      </div>
      <p class="auth-footer"><a routerLink="/login">Volver a inicio de sesión</a></p>
    </div>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorMessage()) {
        <div class="auth-form__error" role="alert">{{ errorMessage() }}</div>
      }

      <div class="auth-field">
        <label for="email">Correo de trabajo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@empresa.com"
        />
      </div>

      <button class="auth-submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'Enviar enlace' }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <p class="auth-footer"><a routerLink="/login">Volver a inicio de sesión</a></p>
    </form>
  }
</app-auth-layout>
